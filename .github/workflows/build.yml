name: Windows build and draft release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Preserve upstream line endings for patch application
        run: git config --global core.autocrlf false

      - name: Check out source and pinned upstream
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Validate version and read font lock
        id: metadata
        run: |
          $version = (Get-Content APP_VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$') {
            throw "Invalid APP_VERSION: $version"
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME must match APP_VERSION v$version"
          }
          $fontCommit = (Get-Content assets/fonts/manifest.json -Raw | ConvertFrom-Json).source_commit
          "version=$version" >> $env:GITHUB_OUTPUT
          "font_commit=$fontCommit" >> $env:GITHUB_OUTPUT

      - name: Install pinned development tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: '2026.9.14'

      - name: Cache locked font downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/fonts/${{ steps.metadata.outputs.font_commit }}
          key: fonts-v1-${{ runner.os }}-${{ steps.metadata.outputs.font_commit }}-${{ hashFiles('assets/fonts/manifest.json') }}

      - name: Check source, tests, and generated assets
        run: mise run check

      - name: Build distribution ZIP
        run: mise run package

      - name: Check that the build did not modify tracked inputs
        run: |
          git diff --exit-code --ignore-submodules=none
          if ($LASTEXITCODE -ne 0) { throw 'Build changed tracked inputs' }

      - name: Generate ZIP checksum
        env:
          APP_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          $filename = "JIZURA-Desktop-$env:APP_VERSION-windows-amd64.zip"
          $checksum = (Get-FileHash -LiteralPath "dist/$filename" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  $filename" | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding utf8NoBOM

      - name: Upload ZIP and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-amd64
          path: |
            dist/JIZURA-Desktop-${{ steps.metadata.outputs.version }}-windows-amd64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download verified build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-amd64
          path: release-assets

      - name: Verify checksum
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt

      - name: Create or update draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          APP_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          zip="release-assets/JIZURA-Desktop-${APP_VERSION}-windows-amd64.zip"
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo 'Refusing to overwrite an already published release.' >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "$zip" release-assets/SHA256SUMS.txt --clobber
          else
            flags=()
            if [[ "$APP_VERSION" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "$zip" release-assets/SHA256SUMS.txt \
              --verify-tag --draft --title "JIZURA Desktop $RELEASE_TAG" \
              --generate-notes "${flags[@]}"
          fi
